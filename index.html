<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Yuki 自习室 · 主动回忆 · 间隔重复 · AI 语境阅读</title>
    <meta name="description" content="Yuki 自习室：主动回忆 + 间隔重复的英语背词工作台，内置 4500 词库、AI 语境阅读室与助教，支持多设备云同步。" />
    <meta name="theme-color" content="#0f1013" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Yuki" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/icon-192.png" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/views.css" />
    <script>
      // 首帧前应用已保存的主题，避免闪白
      try {
        var d = JSON.parse(localStorage.getItem('yuki.data.v2') || 'null');
        var t = (d && d.settings && d.settings.theme) || localStorage.getItem('lexora.theme');
        if (t === 'light') document.documentElement.dataset.theme = 'light';
      } catch (e) {}
    </script>
  </head>
  <body class="is-loading">
    <div class="scene" aria-hidden="true"></div>

    <div class="app">
      <aside class="sidebar" aria-label="主导航">
        <a class="brand" href="#home">
          <span class="brand-mark" aria-hidden="true">Y</span>
          <span class="brand-text"><strong>Yuki 自习室</strong><small>Active Recall Studio</small></span>
        </a>

        <nav class="nav" aria-label="页面">
          <button type="button" class="nav-item" data-view-target="home"><i data-lucide="sun-medium"></i><span>今日</span><kbd>1</kbd></button>
          <button type="button" class="nav-item" data-view-target="learn"><i data-lucide="layers"></i><span>背词</span><em class="nav-badge" id="nav-due-badge" hidden>0</em><kbd>2</kbd></button>
          <button type="button" class="nav-item" data-view-target="reading"><i data-lucide="book-open-text"></i><span>阅读室</span><kbd>3</kbd></button>
          <button type="button" class="nav-item" data-view-target="chat"><i data-lucide="sparkles"></i><span>AI 助教</span><kbd>4</kbd></button>
          <button type="button" class="nav-item" data-view-target="stats"><i data-lucide="bar-chart-3"></i><span>统计</span><kbd>5</kbd></button>
          <button type="button" class="nav-item" data-view-target="settings"><i data-lucide="settings-2"></i><span>设置</span><kbd>6</kbd></button>
        </nav>

        <div class="sidebar-foot">
          <button type="button" class="sync-chip" id="sync-chip" data-state="offline" title="云同步">
            <i class="sync-dot"></i><i data-lucide="cloud"></i><span id="sync-chip-text">登录同步</span>
          </button>
          <div class="side-tools">
            <div class="streak" title="连续学习天数"><i data-lucide="flame"></i><strong id="streak-count">0</strong><span>天</span></div>
            <button type="button" class="icon-btn" id="lookup-btn" title="查词 ( / )"><i data-lucide="search"></i></button>
            <button type="button" class="icon-btn" id="theme-toggle" title="切换主题"><i data-lucide="sun"></i></button>
            <button type="button" class="icon-btn" id="help-btn" title="快捷键 ( ? )"><i data-lucide="keyboard"></i></button>
          </div>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div><p class="eyebrow" id="page-eyebrow">TODAY · 今日</p><h1 id="page-title" class="serif">今天，从这里开始</h1></div>
        </header>

        <section class="view" data-view="home" id="view-home" aria-label="今日"></section>
        <section class="view" data-view="learn" id="view-learn" aria-label="背词" hidden>
          <div class="view-loading"><i data-lucide="loader-2" class="spin"></i><span>正在载入词库…</span></div>
        </section>
        <section class="view" data-view="reading" id="view-reading" aria-label="阅读室" hidden>
          <div class="view-loading"><i data-lucide="loader-2" class="spin"></i><span>正在载入词库…</span></div>
        </section>
        <section class="view" data-view="chat" id="view-chat" aria-label="AI 助教" hidden></section>
        <section class="view" data-view="stats" id="view-stats" aria-label="统计" hidden></section>
        <section class="view" data-view="settings" id="view-settings" aria-label="设置" hidden></section>
      </main>
    </div>

    <nav class="tabbar" aria-label="移动端导航">
      <button type="button" data-view-target="home"><i data-lucide="sun-medium"></i><span>今日</span></button>
      <button type="button" data-view-target="learn"><i data-lucide="layers"></i><span>背词</span></button>
      <button type="button" data-view-target="reading"><i data-lucide="book-open-text"></i><span>阅读</span></button>
      <button type="button" data-view-target="chat"><i data-lucide="sparkles"></i><span>助教</span></button>
      <button type="button" data-view-target="stats"><i data-lucide="bar-chart-3"></i><span>统计</span></button>
      <button type="button" data-view-target="settings"><i data-lucide="settings-2"></i><span>设置</span></button>
    </nav>

    <div id="overlay-root"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="js/lucide.min.js"></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
